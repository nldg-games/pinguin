<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PINGUIN — Arctic Jump</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8efff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100dvh;max-width:1200px;max-height:800px;overflow:hidden;background:#c8efff}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#hud{position:absolute;inset:0;pointer-events:none;color:#153653}#level{position:absolute;top:16px;left:18px;text-align:center;background:#ffffffd9;border:2px solid #fff;border-radius:999px;padding:7px 13px;font-weight:800;letter-spacing:.04em;box-shadow:0 3px 0 #a4d5e8}#hint{position:absolute;top:17px;right:18px;text-align:center;background:#ffffffd9;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}#timer{position:absolute;top:62px;right:18px;text-align:center;background:#ffffffd9;border:2px solid #fff;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:800;box-shadow:0 3px 0 #a4d5e8;font-variant-numeric:tabular-nums}#hearts{position:absolute;top:62px;left:18px;text-align:center;background:#ffffffd9;border:2px solid #fff;border-radius:999px;padding:6px 12px;font-size:22px;letter-spacing:3px;box-shadow:0 3px 0 #a4d5e8;line-height:1}#hearts .empty{opacity:.22}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#15365324;pointer-events:auto}#panel{width:min(440px,94%);text-align:center;background:#ffffffef;border:4px solid white;border-radius:28px;padding:25px 24px 24px;box-shadow:0 10px 0 #8fc7dd,0 18px 45px #17415b30;color:#173a56}#panel h1{font-size:clamp(36px,8vw,58px);letter-spacing:.07em;margin:0 0 5px;line-height:1.1}#panel p{text-align:center;font-size:16px;line-height:1.5;margin:10px auto 20px;max-width:34ch;text-wrap:balance;overflow-wrap:normal;hyphens:none}#panel h1,#panel p,#panel #sub,#panel button{text-align:center}#panel p,#panel #sub{margin-left:auto;margin-right:auto}
#overlay #panel p{display:block;width:100%;max-width:34ch;margin-left:auto;margin-right:auto;text-align:center!important;float:none;position:relative;left:auto;right:auto}
#overlay #panel #sub{width:100%;max-width:none;text-align:center!important}
#panel .win-line{display:block;width:100%;max-width:100%;text-align:center;text-wrap:balance}
#panel .win-line+.win-line{margin-top:18px}#sub{text-align:center;width:100%;max-width:none}#sub .win-line{display:block;width:100%;text-align:center;text-wrap:balance}#sub .win-line+.win-line{margin-top:10px}#panel button{border:0;border-radius:999px;background:#ff9e37;color:#fff;font-size:18px;font-weight:900;padding:13px 32px;box-shadow:0 5px 0 #d97922;cursor:pointer}#panel button:active{transform:translateY(3px);box-shadow:0 2px 0 #d97922}#sub{font-size:12px!important;color:#58758a;margin:16px 0 0!important}#panel.hidden,#overlay.hidden{display:none}@media(max-width:540px){#panel p{font-size:15px;max-width:30ch}#panel .win-line{padding-inline:2px}#hint{top:62px;left:18px;right:auto;font-size:12px}#hearts{top:101px;left:18px;font-size:20px}#timer{top:101px;right:18px;font-size:13px}#level{top:14px}#panel{padding:23px 19px}}
</style></head><body><div id="wrap"><canvas id="game" aria-label="Pinguin game. Tap or press Space to jump."></canvas><div id="hud"><div id="level">LEVEL 1 / 3</div><div id="hearts" aria-label="5 hearts remaining">♥ ♥ ♥ ♥ ♥</div><div id="timer" aria-label="Elapsed time">TIME 00:00.0</div><div id="hint">TAP / CLICK / SPACE TO JUMP</div></div><div id="overlay"><div id="panel"><h1>PINGUIN</h1><p>Hop over the icy blocks and help our penguin make it across the Arctic!</p><button id="start">PLAY</button><p id="sub">Jump only when your feet are on the snow.</p></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),levelLabel=document.getElementById('level'),heartsLabel=document.getElementById('hearts'),timerLabel=document.getElementById('timer'),startBtn=document.getElementById('start');
let W=900,H=600,dpr=1,state='title',level=0,last=0,worldX=0,player,obstacles=[],particles=[],speed=245,groundY=0,levelDistance=0,levelPassed=0,deadTimer=0,winTimer=0,hunterX=0,snowballX=0,snowballY=0,hearts=5,runTime=0,bestTime=loadBestTime(),newBest=false,bossHits=0,bossShake=0,bossHitTimer=0,bossWalkTime=0,bossOrigin=0,shots=[],tt=0,burstT=0,burstMax=.7,burstX=0,burstY=0;
const BURST_WORD='WHACK!!!',BURST_RISE=205;
const configs=[{speed:245,blocks:[[470,44,53],[690,47,61],[930,48,57],[1150,48,65],[1390,48,58],[1620,48,66]]},{speed:270,blocks:[[440,48,73],[660,50,82],[900,48,75],[1110,50,88],[1350,50,80],[1580,52,90]]},{speed:280,blocks:[[430,50,88],[665,50,94],[905,52,100],[1135,52,96],[1370,54,104],[1610,54,100]]}];
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(420,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);groundY=H*.79;if(player){player.y=Math.min(player.y,groundY-player.h);if(player.grounded)player.y=groundY-player.h}if(obstacles.length)for(const o of obstacles)o.y=groundY-o.h}
window.addEventListener('resize',resize);resize();
function loadBestTime(){try{const n=Number(localStorage.getItem('pinguinBestTime'));return Number.isFinite(n)&&n>0?n:null}catch(e){return null}}
function formatTime(seconds){const minutes=Math.floor(seconds/60),secs=Math.floor(seconds%60),tenths=Math.floor((seconds-Math.floor(seconds))*10);return `${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${tenths}`}
function updateTimer(){timerLabel.textContent=`TIME ${formatTime(runTime)}`;timerLabel.setAttribute('aria-label',`Elapsed time ${formatTime(runTime)}`)}
function startNewRun(){runTime=0;newBest=false;updateTimer()}
function updateHearts(){heartsLabel.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<hearts?'full':'empty'}">♥</span>`).join(' ');heartsLabel.setAttribute('aria-label',`${hearts} hearts remaining`);}
function resetLevel(n,refill=true){level=n;if(refill)hearts=5;speed=configs[n].speed;worldX=0;levelPassed=0;obstacles=configs[n].blocks.map(([x,w,h])=>({x,y:groundY-h,w,h,hit:false}));player={x:W*.19,y:groundY-62,w:48,h:62,vy:0,grounded:true,anim:0};particles=[];shots=[];levelLabel.textContent=`LEVEL ${level+1} / 3`;updateHearts();}
function showScreen(title,desc,button,sub=''){const fightMode=false;overlay.classList.toggle('fight-mode',fightMode);panel.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="action">${button}</button>${sub?`<p id="sub">${sub}</p>`:''}`;overlay.classList.remove('hidden');document.getElementById('action').addEventListener('click',()=>{if(state==='title'||state==='dead'||state==='win'){const fullRestart=state==='win'||state==='title'||hearts<=0;if(fullRestart){resetLevel(0,true);startNewRun()}else resetLevel(level,false);state='playing';overlay.classList.add('hidden');overlay.classList.remove('fight-mode');last=performance.now();}else if(state==='hunter'){overlay.classList.add('hidden');overlay.classList.remove('fight-mode');state='bossfight';last=performance.now();}})}
function start(){resetLevel(0);startNewRun();state='playing';overlay.classList.add('hidden');last=performance.now()}
startBtn.addEventListener('click',start);
function jump(){if(state==='title'){start();return}if(state!=='playing'||!player.grounded)return;player.vy=-730;player.grounded=false;for(let i=0;i<5;i++)particles.push({x:player.x+20+Math.random()*15,y:groundY-3,vx:(Math.random()-.5)*90,vy:-Math.random()*90,life:.35});}
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}if(e.code==='Enter'&&!overlay.classList.contains('hidden')){e.preventDefault();(document.getElementById('action')||document.getElementById('start'))?.click()}});canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='bossfight')launchBossProjectile();else jump()});
function launchBossProjectile(){if(state!=='bossfight')return;shots.push({x:player.x+player.w+4,y:player.y+25});}
function die(){if(state!=='playing')return;hearts=Math.max(0,hearts-1);updateHearts();state='dead';if(hearts>0){showScreen('OUCH!','You touched the ice! Level restarting. You have '+hearts+' '+(hearts===1?'heart':'hearts')+' left.','RETRY LEVEL','You lose one heart each time you touch the ice.');}else{showScreen('GAME OVER','You ran out of hearts! Let’s start the adventure again.','START AGAIN','You’ll get 5 new hearts at the beginning of Level 1.');}}
function win(){state='win';newBest=bestTime===null||runTime<bestTime;if(newBest){bestTime=runTime;try{localStorage.setItem('pinguinBestTime',String(bestTime))}catch(e){}}const result=newBest?'NEW BEST TIME!':`Your time: ${formatTime(runTime)} · Best: ${formatTime(bestTime)}`;showScreen('YOU WIN!','<span class="win-line">You stopped the hunter!</span><span class="win-line">The Arctic is safe thanks to you.</span>','PLAY AGAIN',`<span class=\"win-line\">${result}</span><span class=\"win-line\">Can you beat your time next round?</span>`);}
function update(dt){burstT=Math.max(0,burstT-dt);if(['playing','hunter','bossfight','snowball','victory_anim'].includes(state)){runTime+=dt;updateTimer()}if(bossHitTimer>0)bossHitTimer=Math.max(0,bossHitTimer-dt);if(bossShake>0)bossShake=Math.max(0,bossShake-dt*45);if(['bossfight','snowball'].includes(state)){bossWalkTime+=dt;hunterX=bossOrigin-Math.abs(Math.sin(bossWalkTime*1.35))*W*.13;}if(state==='hunter')return;if(state==='bossfight'){for(const sh of shots){sh.x+=560*dt;sh.y+=(groundY-60-sh.y)*Math.min(1,dt*3);if(!sh.hit&&sh.x>=hunterX-24){sh.hit=true;bossHits++;bossShake=10;bossHitTimer=.42;burstX=hunterX-75;burstY=Math.max(125,groundY-BURST_RISE);burstMax=bossHits>=3?1.15:.7;burstT=burstMax;if(bossHits>=3){state='victory_anim';winTimer=1.15;shots=[];break}}}shots=shots.filter(sh=>!sh.hit&&sh.x<W+40);return}if(state==='victory_anim'){winTimer-=dt;if(winTimer<=0)win();return}if(state!=='playing')return;player.anim+=dt;worldX+=speed*dt;levelPassed+=speed*dt;player.vy+=1750*dt;player.y+=player.vy*dt;if(player.y+player.h>=groundY){player.y=groundY-player.h;player.vy=0;player.grounded=true;}else player.grounded=false;
// Move each obstacle relative to the scrolling world. Obstacles are lethal, not platforms.
for(const o of obstacles){const sx=o.x-worldX+W*.19;if(sx+o.w<0||sx>W+10)continue;const px=player.x+9,pr=player.x+player.w-8,py=player.y+7,pb=player.y+player.h-2;if(pr>sx+3&&px<sx+o.w-3&&pb>o.y+2&&py<groundY-1){die();return}}
particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt}
const lastBlock=obstacles[obstacles.length-1],endX=lastBlock.x+lastBlock.w+280;if(worldX>endX){if(level<2){resetLevel(level+1,true)}else{state='hunter';hunterX=W*.78;bossOrigin=hunterX;bossWalkTime=0;bossHitTimer=0;bossHits=0;showScreen('FINAL FIGHT!','The hunter is blocking your path! Throw snowballs to stop him.','FIGHT!','Tap anywhere on the screen to throw a snowball. Three hits to win!');last=performance.now();}}
}
// Big comic-book impact burst shown for a moment after each hit.
function drawBurst(){if(burstT<=0)return;const k=burstT/burstMax,age=burstMax-burstT,pop=1+Math.max(0,.18-age)*3,s=Math.min(1,W/520)*pop;const bs=Math.min(1,W/520);ctx.save();ctx.translate(Math.max(125*bs,Math.min(W-125*bs,burstX)),burstY);ctx.rotate(-.12);ctx.scale(s,s);ctx.globalAlpha=Math.min(1,k*4);
ctx.beginPath();for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=i%2?62:98;ctx.lineTo(Math.cos(a)*r*1.35,Math.sin(a)*r*.85)}ctx.closePath();ctx.fillStyle='#ffe23b';ctx.fill();ctx.strokeStyle='#d0261c';ctx.lineWidth=7;ctx.stroke();
ctx.font=(BURST_WORD.length>8?'900 36px':'900 42px')+' Impact, "Arial Black", system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const fit=Math.min(1,150/ctx.measureText(BURST_WORD).width);ctx.scale(fit,fit);ctx.lineWidth=9;ctx.strokeStyle='#1b1020';ctx.strokeText(BURST_WORD,0,2);ctx.fillStyle='#ff3b2f';ctx.fillText(BURST_WORD,0,2);ctx.restore();ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9ee2ff');g.addColorStop(1,'#e6f9ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// sun and soft clouds
ctx.fillStyle='#fff7c7';ctx.beginPath();ctx.arc(W*.82,H*.17,31,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){const x=((i*210-worldX*.13)%(W+220)+W+220)%(W+220)-80,y=H*(.16+(i%3)*.08);ctx.fillStyle='#ffffff9c';ctx.beginPath();ctx.ellipse(x,y,38,13,0,0,Math.PI*2);ctx.ellipse(x+25,y-7,25,17,0,0,Math.PI*2);ctx.ellipse(x+49,y,31,12,0,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#a5dff2';ctx.beginPath();ctx.moveTo(0,groundY);for(let x=0;x<=W+80;x+=80)ctx.lineTo(x,groundY-90-(Math.sin((x+worldX*.15)/100)*24));ctx.lineTo(W,groundY);ctx.fill();ctx.fillStyle='#d0f0fa';ctx.beginPath();ctx.moveTo(0,groundY);for(let x=0;x<=W+60;x+=60)ctx.lineTo(x,groundY-45-(Math.cos((x+worldX*.22)/90)*18));ctx.lineTo(W,groundY);ctx.fill();
// snow ground
ctx.fillStyle='#fff';ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='#d8f4fc';ctx.fillRect(0,groundY+9,W,6);ctx.strokeStyle='#b8e5f4';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<W;x+=50){let xx=(x-worldX*.6%50+50)%W;ctx.moveTo(xx,groundY+25);ctx.lineTo(xx+17,groundY+25)}ctx.stroke();}
function drawIce(o){const x=o.x-worldX+W*.19;if(x+o.w<-5||x>W+5)return;ctx.save();ctx.shadowColor='#60a9ca';ctx.shadowBlur=7;ctx.shadowOffsetY=3;rounded(x,o.y,o.w,o.h,7,'#77cce9','#4bafd5');ctx.restore();ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.moveTo(x+1,o.y+9);ctx.lineTo(x+8,o.y+2);ctx.lineTo(x+o.w*.35,o.y+5);ctx.lineTo(x+o.w*.54,o.y);ctx.lineTo(x+o.w-3,o.y+5);ctx.lineTo(x+o.w-1,o.y+11);ctx.closePath();ctx.fill();ctx.strokeStyle='#a1e6f8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+o.w*.3,o.y+17);ctx.lineTo(x+o.w*.42,o.y+35);ctx.lineTo(x+o.w*.34,o.y+48);ctx.stroke();}
function drawPenguin(){const p=player,x=p.x,y=p.y,w=p.w,h=p.h;ctx.save();ctx.translate(x+w/2,y+h/2);if(!p.grounded)ctx.rotate(-.08); // shadow
ctx.fillStyle='#6db8d0a0';ctx.beginPath();ctx.ellipse(0,h/2+7,25,5,0,0,Math.PI*2);ctx.fill();
// body
ctx.fillStyle='#173b55';ctx.beginPath();ctx.ellipse(0,2,23,31,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7fdff';ctx.beginPath();ctx.ellipse(1,8,15,22,0,0,Math.PI*2);ctx.fill();
// wings
ctx.fillStyle='#234e69';ctx.beginPath();ctx.ellipse(-20,8,6,17,.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(20,8,6,17,-.2,0,Math.PI*2);ctx.fill();
// feet
ctx.fillStyle='#ff982e';ctx.beginPath();ctx.ellipse(-11,29,10,5,.12,0,Math.PI*2);ctx.ellipse(10,29,10,5,-.12,0,Math.PI*2);ctx.fill();
// face
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-13,6,0,Math.PI*2);ctx.arc(8,-13,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#142f43';ctx.beginPath();ctx.arc(-6,-12,2.5,0,Math.PI*2);ctx.arc(9,-12,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9a2e';ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(10,-2);ctx.lineTo(-2,3);ctx.closePath();ctx.fill();ctx.restore();}
function drawHunter(){
const x=['hunter','bossfight','snowball','victory_anim'].includes(state)?hunterX:W+100,y=groundY-101;
ctx.save();if(bossHitTimer>0 && Math.floor(bossHitTimer*24)%2===0)ctx.globalAlpha=.22; if(bossShake){ctx.translate((Math.random()-.5)*bossShake,(Math.random()-.5)*bossShake)}ctx.translate(x,y);
if(state==='victory_anim'){ctx.rotate(-.9*(1-Math.max(0,winTimer)/1.15));ctx.translate(40,12)}
// Boots and legs
ctx.lineCap='round';ctx.strokeStyle='#4a403b';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-9,65);ctx.lineTo(-14,86);ctx.moveTo(10,65);ctx.lineTo(20,85);ctx.stroke();
rounded(-25,82,20,10,4,'#342f30','#24262a');rounded(12,81,23,11,4,'#342f30','#24262a');
// Heavy arctic trousers
rounded(-17,48,34,22,7,'#554b49','#393637');
// Oversized grey-white fur coat with dark seams
rounded(-29,20,58,42,13,'#c8cbd0','#737b84');
// fluffy front trim
ctx.strokeStyle='#f5f1e8';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-24,25);ctx.lineTo(-25,51);ctx.moveTo(24,25);ctx.lineTo(25,51);ctx.moveTo(-20,59);ctx.lineTo(20,59);ctx.stroke();
// coat panels and belt
ctx.strokeStyle='#8d969f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,27);ctx.lineTo(0,53);ctx.stroke();
rounded(-23,43,46,6,3,'#76533b');rounded(-4,42,9,8,2,'#d7c39a','#5d493c');
// mittens
ctx.fillStyle='#373a40';ctx.beginPath();ctx.ellipse(-32,49,9,8,-.3,0,Math.PI*2);ctx.ellipse(32,49,9,8,.3,0,Math.PI*2);ctx.fill();
// neck scarf
ctx.fillStyle='#414750';ctx.beginPath();ctx.moveTo(-14,16);ctx.lineTo(14,16);ctx.lineTo(11,28);ctx.lineTo(-10,28);ctx.closePath();ctx.fill();
// head, warm cheeks, nose and face
ctx.fillStyle='#e6ad83';ctx.beginPath();ctx.ellipse(0,8,18,19,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f4c39b';ctx.beginPath();ctx.ellipse(-10,13,5,4,0,0,Math.PI*2);ctx.ellipse(10,13,5,4,0,0,Math.PI*2);ctx.fill();
// eyebrows and eyes
ctx.strokeStyle='#342b2a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-13,1);ctx.lineTo(-4,4);ctx.moveTo(4,4);ctx.lineTo(14,0);ctx.stroke();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-8,7,5,6,0,0,Math.PI*2);ctx.ellipse(8,7,5,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263440';ctx.beginPath();ctx.arc(-7,8,2.4,0,Math.PI*2);ctx.arc(9,8,2.4,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e88468';ctx.beginPath();ctx.ellipse(1,13,5,4,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#70453b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-6,20);ctx.quadraticCurveTo(1,24,8,18);ctx.stroke();
// Dark winter trapper hat with plush pale fur band and ear flaps
ctx.fillStyle='#41444a';ctx.beginPath();ctx.ellipse(0,-5,24,15,0,Math.PI,Math.PI*2);ctx.fill();
rounded(-23,-7,46,9,5,'#353941');
ctx.strokeStyle='#f4f0e8';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-20,-6);ctx.quadraticCurveTo(0,-1,20,-6);ctx.stroke();
ctx.fillStyle='#d9d8d3';ctx.beginPath();ctx.ellipse(-20,5,7,14,-.1,0,Math.PI*2);ctx.ellipse(20,5,7,14,.1,0,Math.PI*2);ctx.fill();
// simple fur texture dots
ctx.fillStyle='#fffaf0';for(const [fx,fy] of [[-16,-5],[-7,-2],[4,-3],[13,-5],[-20,3],[20,3]]){ctx.beginPath();ctx.arc(fx,fy,1.8,0,Math.PI*2);ctx.fill();}
// Bow and quiver silhouette behind him
ctx.strokeStyle='#795137';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(31,19);ctx.quadraticCurveTo(48,36,32,56);ctx.stroke();ctx.strokeStyle='#e7d7b9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(31,19);ctx.lineTo(32,56);ctx.stroke();
rounded(25,25,9,25,3,'#755039');ctx.strokeStyle='#d9d4c9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(27,26);ctx.lineTo(24,17);ctx.moveTo(31,26);ctx.lineTo(33,16);ctx.moveTo(35,27);ctx.lineTo(39,19);ctx.stroke();
ctx.restore();
}
function drawSnowball(){for(const sh of shots){snowballX=sh.x;snowballY=sh.y;drawOneShot()}}
function drawOneShot(){ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#8ccfe8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(snowballX,snowballY,11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#dff7ff';ctx.beginPath();ctx.arc(snowballX-3,snowballY-4,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){drawBackground();for(const o of obstacles)drawIce(o);if(player)drawPenguin();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}drawSnowball();if(state==='hunter'||state==='bossfight'||state==='snowball'||state==='victory_anim')drawHunter();if(['hunter','bossfight','snowball'].includes(state)){ctx.fillStyle='#17425b';ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillText('HUNTER HEALTH: '+(3-bossHits)+' / 3',W<540?W/2:W*.72,W<540?165:38);}if(state==='playing'){ctx.fillStyle='#17425b';ctx.font='700 13px system-ui';ctx.textAlign='right';ctx.fillText('KEEP HOPPING!',W-18,H-20)}drawBurst()}
function loop(t){const dt=Math.min(.032,Math.max(0,(t-last)/1000||0));last=t;tt+=dt;update(dt);draw();requestAnimationFrame(loop)}
// Initial art behind title screen
resetLevel(0,true);requestAnimationFrame(loop);
})();
</script></body></html>
