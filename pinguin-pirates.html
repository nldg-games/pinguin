<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pinguin Pirates</title><!-- Version 4: scarier Kraken -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd9ef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100dvh;max-width:1200px;max-height:800px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#hud{position:absolute;inset:0;pointer-events:none;color:#17384d;font-weight:850}#level,#hearts,#hint{position:absolute;background:#ffffffdc;border:2px solid white;border-radius:999px;padding:7px 13px;box-shadow:0 3px 0 #4b9eb6}#level{top:15px;left:16px}#hearts{top:61px;left:16px;font-size:21px;letter-spacing:3px;line-height:1}#hint{top:15px;right:16px;font-size:12px}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#102f4530}#panel{width:min(620px,92%);min-width:0;text-align:center;background:#fffef0;border:4px solid white;border-radius:26px;padding:clamp(18px,3vw,30px) clamp(14px,3vw,26px);box-shadow:0 9px 0 #4c9eb7,0 16px 38px #17384d55;color:#17384d;overflow:hidden}h1{font-size:clamp(27px,5.4vw,58px)!important;margin:0 0 8px;line-height:1.08;letter-spacing:.015em;overflow-wrap:anywhere;text-wrap:balance}p{font-size:16px;line-height:1.45;margin:10px 0 20px}button{border:0;border-radius:999px;background:#ff9d35;color:white;font-size:19px;font-weight:900;padding:13px 34px;box-shadow:0 5px 0 #cf7022;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #cf7022}.hidden{display:none!important}@media(max-width:540px){#hint{top:61px;right:12px;font-size:10px}#hearts{top:105px;left:12px}#level{left:12px}}
</style></head><body><div id="wrap"><canvas id="game" aria-label="Pinguin Pirates. Tap to jump over pirate penguins and tap to throw barrels at the Kraken."></canvas><div id="hud"><div id="level">LEVEL 1 / 3</div><div id="hearts">♥ ♥ ♥ ♥ ♥</div><div id="hint">TAP / CLICK / SPACE TO JUMP</div></div><div id="overlay"><div id="panel"><h1>🏴‍☠️ PINGUIN PIRATES</h1><p>Ahoy! Help Pinguin hop over the pirate penguins and sail to the Kraken. Three levels of pirate trouble await!</p><button id="action">SET SAIL!</button><p style="font-size:12px;color:#66808b;margin-bottom:0">Tap, click or press SPACE to jump. Avoid the pirates!</p></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),levelEl=document.getElementById('level'),heartsEl=document.getElementById('hearts');
let W=900,H=600,dpr=1,ground=0,state='title',level=0,hearts=5,last=0,world=0,speed=250,player=null,obstacles=[],barrels=[],hits=0,krakenX=0,shake=0,flash=0,particles=[],bossAnim=0,tt=0,jumpBuf=0,whamT=0,whamX=0,whamY=0;
const configs=[{speed:255,items:[[470,48,54,0],[710,50,62,1],[960,48,55,0],[1190,50,67,1],[1440,48,57,0],[1680,50,64,1]]},{speed:280,items:[[450,50,68,1],[670,48,54,0],[900,52,82,2],[1130,50,63,1],[1370,54,91,2],[1610,50,72,1],[1850,54,96,2]]},{speed:295,items:[[440,52,86,2],[680,48,57,0],[920,54,101,2],[1160,52,72,1],[1400,56,112,3],[1640,52,91,2],[1880,56,118,3],[2120,54,99,2]]}];
function resize(){let r=document.getElementById('wrap').getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.79;if(player)player.x=W*.19;if(player&&player.grounded)player.y=ground-player.h}window.addEventListener('resize',resize);resize();
function hud(){levelEl.textContent=state==='boss'||state==='fight'||state==='victory'?'KRAKEN BATTLE':`LEVEL ${level+1} / 3`;heartsEl.innerHTML=Array.from({length:5},(_,i)=>`<span style="opacity:${i<hearts?1:.2}">♥</span>`).join(' ')}
function reset(n,refill=true){level=n;jumpBuf=0;whamT=0;if(refill)hearts=5;world=0;speed=configs[n].speed;obstacles=configs[n].items.map(([x,w,h,hat])=>({x,w,h,hat,done:false}));player={x:W*.19,y:ground-64,w:48,h:64,vy:0,grounded:true,anim:0};barrels=[];particles=[];hud()}
function screen(title,desc,button,sub=''){panel.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="action">${button}</button>${sub?`<p style="font-size:12px;color:#66808b;margin-bottom:0">${sub}</p>`:''}`;overlay.classList.remove('hidden');document.getElementById('action').onclick=()=>{if(state==='title'||state==='dead'||state==='over'||state==='win'||state==='victory'){if(state==='dead'&&hearts>0)reset(level,false);else reset(0,true);state='run';overlay.classList.add('hidden');last=performance.now()}else if(state==='boss'){state='fight';hits=0;barrels=[];hud();overlay.classList.add('hidden');last=performance.now()}}}
function start(){reset(0);state='run';overlay.classList.add('hidden');last=performance.now()}
document.getElementById('action').onclick=start;
function jump(){if(state==='title'){start();return}if(state!=='run')return;if(!player.grounded){jumpBuf=.12;return}player.vy=-720;player.grounded=false;}
function attack(){if(state!=='fight')return;barrels.push({x:player.x+player.w,y:player.y+28,hit:false});}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='fight')attack();else jump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='Enter'&&overlay.classList.contains('hidden')===false)document.getElementById('action')?.click()});
function die(){if(state!=='run')return;hearts--;hud();state='dead';if(hearts>0)screen('OOPS!','A pirate penguin caught you! Try that level again.','RETRY','You have '+hearts+(hearts===1?' heart left.':' hearts left.'));else{state='over';screen('SHIPWRECKED!','You ran out of hearts. Ready to try again, Captain?','PLAY AGAIN')}}
function update(dt){if(state==='run'){world+=speed*dt;player.anim+=dt;player.vy+=1750*dt;player.y+=player.vy*dt;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.grounded=true;if(jumpBuf>0){jumpBuf=0;player.vy=-720;player.grounded=false}}else player.grounded=false;jumpBuf=Math.max(0,jumpBuf-dt);for(const o of obstacles){let x=o.x-world+W*.19;if(x+o.w<0||x>W)continue;let px=player.x+9,pr=player.x+player.w-7,py=player.y+5,pb=player.y+player.h-2;const pirateTop=ground-(supportHeights[level]+70);if(pr>x+4&&px<x+o.w-4&&pb>pirateTop&&py<ground-1){die();return}}let end=obstacles.at(-1).x+obstacles.at(-1).w+300;if(world>end){if(level<2){reset(level+1,true)}else{state='boss';krakenX=W*(W<540?.72:.76);hits=0;hud();screen('THE KRAKEN!','A giant Kraken has attacked the ship! Tap FIGHT to begin. Then tap anywhere to throw barrels. Three hits will defeat it!','FIGHT!','The Kraken stays on screen while you battle.')}}}
if(state==='fight'){for(const b of barrels){b.x+=620*dt;if(!b.hit&&b.x>krakenX-95*krakenScale()){b.hit=true;hits++;shake=.3;flash=.18;whamT=.7;whamX=b.x;whamY=Math.max(110,b.y-70);for(let i=0;i<12;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*230,vy:(Math.random()-.5)*200,life:.5});if(hits>=3){state='victory';bossAnim=1.2;screen('KRAKEN DEFEATED!','WHAM! WHAM! WHAM! The Kraken dives back into the ocean. Pinguin saves the ship!','PLAY AGAIN','A true pirate hero!');}}}barrels=barrels.filter(b=>!b.hit&&b.x<W+80);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);}
whamT=Math.max(0,whamT-dt);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt}particles=particles.filter(p=>p.life>0);
}
function rr(x,y,w,h,r,c,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#72d4ed');g.addColorStop(.65,'#c5f2f5');g.addColorStop(1,'#f6e4b7');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff5c7';ctx.beginPath();ctx.arc(W*.82,H*.16,30,0,7);ctx.fill();for(let i=0;i<4;i++){let x=((i*250-world*.12)%(W+200)+W+200)%(W+200)-60,y=H*(.18+i%2*.09);ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(x,y,35,12,0,0,7);ctx.ellipse(x+25,y-7,22,15,0,0,7);ctx.fill()}ctx.fillStyle='#247f91';ctx.beginPath();ctx.moveTo(0,ground+5);for(let x=0;x<=W+30;x+=30)ctx.lineTo(x,ground+5+Math.sin((x+world*.6)/36)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
// wooden ship deck
ctx.fillStyle='#9b5c31';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#c78345';ctx.fillRect(0,ground,W,12);ctx.strokeStyle='#704329';ctx.lineWidth=3;for(let y=ground+28;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=40;x<W;x+=115){ctx.beginPath();ctx.moveTo(x,ground+12);ctx.lineTo(x,H);ctx.stroke()}ctx.fillStyle='#f4e5c2';ctx.fillRect(0,ground-8,W,8);
// mast, sail and rigging
ctx.fillStyle='#70472d';ctx.fillRect(W*.73,ground-280,12,280);ctx.fillStyle='#fff0d2';ctx.beginPath();ctx.moveTo(W*.735,ground-265);ctx.lineTo(W*.48,ground-190);ctx.lineTo(W*.735,ground-115);ctx.closePath();ctx.fill();ctx.strokeStyle='#8c6340';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#65432e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.73,ground-280);ctx.lineTo(W*.45,ground+5);ctx.moveTo(W*.74,ground-280);ctx.lineTo(W*.93,ground+5);ctx.stroke();}
function penguin(x,y,scale=1,hat=0,hero=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
// Body is always planted on the deck: y is the penguin's foot position.
ctx.fillStyle='#17394b';ctx.beginPath();ctx.ellipse(0,-29,23,31,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff9e9';ctx.beginPath();ctx.ellipse(1,-22,15,22,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f28d2e';ctx.beginPath();ctx.ellipse(-10,0,9,4,0,0,Math.PI*2);ctx.ellipse(10,0,9,4,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-42,6,0,Math.PI*2);ctx.arc(8,-42,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#182c38';ctx.beginPath();ctx.arc(-6,-41,2.5,0,Math.PI*2);ctx.arc(9,-41,2.5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f59a32';ctx.beginPath();ctx.moveTo(-3,-32);ctx.lineTo(10,-29);ctx.lineTo(-3,-25);ctx.fill();
if(hero){
// Red pirate bandana, tied at the side; no hat.
ctx.fillStyle='#c83232';ctx.fillRect(-19,-57,38,8);ctx.beginPath();ctx.moveTo(16,-55);ctx.lineTo(29,-49);ctx.lineTo(17,-45);ctx.fill();
// Eye patch and strap over the right eye.
ctx.strokeStyle='#252832';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-17,-49);ctx.lineTo(17,-49);ctx.stroke();ctx.fillStyle='#171c25';ctx.beginPath();ctx.ellipse(8,-42,7,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e8d7b3';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(5,-46);ctx.lineTo(11,-38);ctx.moveTo(11,-46);ctx.lineTo(5,-38);ctx.stroke();
}else{
// Enemy pirate hats are triangular and grow taller with each level.
const heights=[15,15,15,15],hh=heights[Math.min(3,hat)];ctx.fillStyle='#292d38';ctx.beginPath();ctx.moveTo(-19,-55);ctx.lineTo(0,-55-hh);ctx.lineTo(19,-55);ctx.closePath();ctx.fill();ctx.strokeStyle='#171d29';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#d8bd78';ctx.fillRect(-4,-61-hh*.35,8,4);ctx.fillStyle='#292d38';ctx.fillRect(-22,-57,44,5);
}
ctx.restore()}
const supportHeights=[0,18,32];
function drawObstacles(){for(const o of obstacles){let x=o.x-world+W*.19;if(x<-90||x>W+90)continue;const sh=supportHeights[level];if(sh>0){ctx.save();if(o.hat===3){ // sturdy whiskey barrel
ctx.fillStyle='#89502c';ctx.beginPath();ctx.ellipse(x+o.w/2,ground-5,25,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a96b38';ctx.beginPath();ctx.roundRect(x+o.w/2-22,ground-sh,44,sh,8);ctx.fill();ctx.strokeStyle='#5f3925';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+o.w/2-22,ground-sh+7);ctx.lineTo(x+o.w/2+22,ground-sh+7);ctx.moveTo(x+o.w/2-22,ground-8);ctx.lineTo(x+o.w/2+22,ground-8);ctx.stroke();}else{ // wooden soap box / crate
ctx.fillStyle='#b77a3e';ctx.fillRect(x+o.w/2-25,ground-sh,50,sh);ctx.strokeStyle='#704629';ctx.lineWidth=3;ctx.strokeRect(x+o.w/2-25,ground-sh,50,sh);ctx.beginPath();ctx.moveTo(x+o.w/2-20,ground-sh+4);ctx.lineTo(x+o.w/2+20,ground-4);ctx.moveTo(x+o.w/2+20,ground-sh+4);ctx.lineTo(x+o.w/2-20,ground-4);ctx.stroke();}ctx.restore();}
penguin(x+o.w/2,ground-sh,1.0,o.hat,false)}}
function drawHero(){let bob=player.grounded?Math.sin(player.anim*12)*1.5:0;penguin(player.x+24,player.y+64+bob,1.05,0,true)}
function krakenScale(){return Math.max(.6,Math.min(1.1,H/640,W/560))}
// Tapered tentacle along a cubic curve, with suckers on the underside.
function tentacle(p,w0,body,belly,suck){const pts=[];for(let i=0;i<=24;i++){const t=i/24,u=1-t;pts.push([u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6],u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7],w0*(1-t*.94)])}
const L=[],R=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;const nx=-dy/d,ny=dx/d,h=pts[i][2]/2;L.push([pts[i][0]+nx*h,pts[i][1]+ny*h]);R.push([pts[i][0]-nx*h,pts[i][1]-ny*h])}
ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(const q of L)ctx.lineTo(q[0],q[1]);for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();ctx.fill();ctx.strokeStyle='#14061f';ctx.lineWidth=3;ctx.stroke();
// lighter underside strip
ctx.strokeStyle=belly;ctx.lineWidth=Math.max(2,w0*.18);ctx.beginPath();for(let i=0;i<pts.length-2;i++){const q=[(pts[i][0]*.55+R[i][0]*.45),(pts[i][1]*.55+R[i][1]*.45)];i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke();
if(suck)for(let i=3;i<pts.length-3;i+=3){const r=pts[i][2]*.16;const q=[(pts[i][0]*.35+R[i][0]*.65),(pts[i][1]*.35+R[i][1]*.65)];ctx.fillStyle=suck;ctx.beginPath();ctx.arc(q[0],q[1],r+1.5,0,7);ctx.fill();ctx.fillStyle='#3a1a4a';ctx.beginPath();ctx.arc(q[0],q[1],r*.45,0,7);ctx.fill()}}
function drawKraken(){if(state!=='boss'&&state!=='fight'&&state!=='victory')return;const s=krakenScale(),f=flash>0,T=tt,C=c=>f?'#fff':c;
ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*8);ctx.translate(krakenX,ground+6);ctx.scale(s,s);ctx.lineJoin='round';ctx.lineCap='round';
const sw=k=>Math.sin(T*1.6+k)*14;ctx.fillStyle='#14061f55';ctx.beginPath();ctx.ellipse(0,-4,190,18,0,0,7);ctx.fill();
// Back tentacles: raised high and curling over the ship.
tentacle([-40,-70,-170,-120,-230+sw(1),-300,-130+sw(2),-300],46,C('#2b0f3f'),C('#4d2468'),C('#8f6aa6'));
tentacle([45,-70,170,-140,215+sw(3),-280,135+sw(4),-270],40,C('#2b0f3f'),C('#4d2468'),C('#8f6aa6'));
// The long, tall head (mantle) with a darker gradient.
let g=ctx.createLinearGradient(-90,-330,90,-20);g.addColorStop(0,C('#6b2c95'));g.addColorStop(.45,C('#45186a'));g.addColorStop(1,C('#1d0a2c'));
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-82,-30);ctx.bezierCurveTo(-112,-120,-92,-250,-38,-318);ctx.quadraticCurveTo(-8,-352,10,-344);ctx.quadraticCurveTo(30,-332,42,-312);ctx.bezierCurveTo(96,-245,114,-120,84,-30);ctx.quadraticCurveTo(0,-8,-82,-30);ctx.closePath();ctx.fill();if(!f){ctx.save();ctx.clip();let sh=ctx.createRadialGradient(-20,-200,30,0,-150,150);sh.addColorStop(0,'#00000000');sh.addColorStop(.75,'#0000001f');sh.addColorStop(1,'#000000a0');ctx.fillStyle=sh;ctx.fillRect(-130,-360,260,360);ctx.restore()}ctx.strokeStyle='#14061f';ctx.lineWidth=4;ctx.stroke();
// Spiky ridge running down the back of the head.
ctx.fillStyle=C('#2a0c3b');for(let i=0;i<6;i++){const y=-322+i*30,x=4+i*1.5,sz=15-i*1.4;ctx.beginPath();ctx.moveTo(x-sz*.7,y+sz);ctx.lineTo(x+sz*.25,y-sz*.9);ctx.lineTo(x+sz*.8,y+sz);ctx.closePath();ctx.fill();ctx.strokeStyle='#14061f';ctx.lineWidth=2;ctx.stroke()}
// Ridged grooves and warts on the head.
ctx.strokeStyle=f?'#ddd':'#24092f';ctx.lineWidth=4;for(let i=0;i<4;i++){const y=-270+i*40,hw=48+i*12;ctx.beginPath();ctx.moveTo(-hw,y+12);ctx.quadraticCurveTo(0,y-6,hw,y+12);ctx.stroke()}
ctx.fillStyle=C('#7d3fa6');for(const [wx,wy,wr] of [[-50,-215,6],[-62,-160,4],[52,-200,5],[60,-140,7],[-30,-290,4],[34,-262,4]]){ctx.beginPath();ctx.arc(wx,wy,wr,0,7);ctx.fill()}
// Old battle scar across the head.
ctx.strokeStyle=f?'#ccc':'#b58bbf';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(30,-245);ctx.lineTo(54,-205);ctx.lineTo(46,-200);ctx.lineTo(70,-160);ctx.stroke();ctx.lineWidth=2;for(let i=0;i<4;i++){const t=i/3,x=30+40*t,y=-245+85*t;ctx.beginPath();ctx.moveTo(x-7,y+2);ctx.lineTo(x+7,y-2);ctx.stroke()}
// Heavy, dark brow ridge pulled down in an angry V.
ctx.fillStyle=C('#160620');ctx.beginPath();ctx.moveTo(-80,-142);ctx.quadraticCurveTo(-40,-150,-6,-112);ctx.lineTo(6,-112);ctx.quadraticCurveTo(40,-150,80,-142);ctx.lineTo(76,-124);ctx.quadraticCurveTo(40,-130,8,-96);ctx.lineTo(-8,-96);ctx.quadraticCurveTo(-40,-130,-76,-124);ctx.closePath();ctx.fill();
// Narrow, glowing slit eyes.
for(const d of [-1,1]){ctx.save();ctx.translate(d*40,-112);ctx.scale(d,1);ctx.shadowColor=f?'transparent':'#ffcc00';ctx.shadowBlur=18;ctx.fillStyle=C('#ffd23a');ctx.beginPath();ctx.moveTo(-26,-2);ctx.quadraticCurveTo(-4,-12,24,-14);ctx.quadraticCurveTo(10,10,-26,-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=f?'#fff':'#ff6a1a';ctx.beginPath();ctx.ellipse(2,-5,8,5,0,0,7);ctx.fill();ctx.fillStyle='#120511';ctx.beginPath();ctx.ellipse(2,-5,2.2,6,0,0,7);ctx.fill();ctx.restore()}
// Wide snarling maw full of sharp teeth.
const open=8+Math.sin(T*3)*4;ctx.fillStyle=f?'#fff':'#2a0410';ctx.beginPath();ctx.moveTo(-62,-66);ctx.quadraticCurveTo(0,-88,62,-66);ctx.quadraticCurveTo(46,-26+open,0,-20+open);ctx.quadraticCurveTo(-46,-26+open,-62,-66);ctx.closePath();ctx.fill();ctx.strokeStyle='#14061f';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle=f?'#fff':'#8e1430';ctx.beginPath();ctx.ellipse(0,-34+open*.6,26,8,0,0,7);ctx.fill();
ctx.fillStyle=C('#f6efd9');for(let i=0;i<8;i++){const x=-52+i*14.8,y=-74+Math.abs(i-3.5)*-1.6+Math.abs(i-3.5)*2.2,len=i%2?14:20;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x,y+len);ctx.lineTo(x+6,y);ctx.closePath();ctx.fill()}
for(let i=0;i<6;i++){const x=-38+i*15.2,y=-28+open-Math.abs(i-2.5)*2.6,len=i%2?11:15;ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x,y-len);ctx.lineTo(x+5,y);ctx.closePath();ctx.fill()}
// Front tentacles sprawling across the deck, suckers showing.
tentacle([-60,-36,-140,-50+sw(5)*.4,-200,12,-260+sw(6)*.5,-34],44,C('#3a1456'),C('#6a3590'),C('#c9a0d8'));
tentacle([-30,-22,-80,12,-140,22,-175+sw(7)*.5,-12],34,C('#3a1456'),C('#6a3590'),C('#c9a0d8'));
tentacle([55,-30,120,-24+sw(8)*.4,160,20,210+sw(9)*.4,-18],38,C('#3a1456'),C('#6a3590'),C('#c9a0d8'));

// Big comic-book "WHAM!!!" burst shown for a moment after each hit.
function drawWham(){if(whamT<=0)return;const k=whamT/.7,pop=1+Math.max(0,(k-.75))*2.4,s=Math.min(1,W/520)*pop;ctx.save();ctx.translate(whamX,whamY);ctx.rotate(-.12);ctx.scale(s,s);ctx.globalAlpha=Math.min(1,k*3);
