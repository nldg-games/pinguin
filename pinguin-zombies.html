<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PINGUIN-ZOMBIES — Ice Cavern</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d2b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#wrap{position:relative;width:100vw;height:100dvh;max-width:1200px;max-height:800px;overflow:hidden;background:#c8efff}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#hud{position:absolute;inset:0;pointer-events:none;color:#e9f6ff}#level{position:absolute;top:16px;left:18px;text-align:center;background:#082b4aee;border:2px solid #164e78;border-radius:999px;padding:7px 13px;font-weight:800;letter-spacing:.04em;box-shadow:0 3px 0 #041b30;color:#e9f6ff}#hint{position:absolute;top:17px;right:18px;text-align:center;background:#082b4aee;border:2px solid #164e78;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:#dcefff;box-shadow:0 3px 0 #041b30}#timer{position:absolute;top:62px;right:18px;text-align:center;background:#082b4aee;border:2px solid #164e78;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:800;box-shadow:0 3px 0 #041b30;color:#e9f6ff;font-variant-numeric:tabular-nums}#hearts{position:absolute;top:62px;left:18px;text-align:center;background:#082b4aee;border:2px solid #164e78;border-radius:999px;padding:6px 12px;font-size:22px;letter-spacing:3px;box-shadow:0 3px 0 #041b30;line-height:1;color:#e9f6ff}#hearts .empty{opacity:.22}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#15365324;pointer-events:auto}#panel{width:min(440px,94%);text-align:center;background:#ffffffef;border:4px solid white;border-radius:28px;padding:25px 24px 24px;box-shadow:0 10px 0 #8fc7dd,0 18px 45px #17415b30;color:#173a56}#panel h1{font-size:clamp(36px,8vw,58px);letter-spacing:.07em;margin:0 0 5px;line-height:1.1}#panel p{text-align:center;font-size:16px;line-height:1.5;margin:10px auto 20px;max-width:34ch;text-wrap:balance;overflow-wrap:normal;hyphens:none}#panel h1,#panel p,#panel #sub,#panel button{text-align:center}#panel p,#panel #sub{margin-left:auto;margin-right:auto}
#overlay #panel p{display:block;width:100%;max-width:34ch;margin-left:auto;margin-right:auto;text-align:center!important;float:none;position:relative;left:auto;right:auto}
#overlay #panel #sub{width:100%;max-width:none;text-align:center!important}
#panel .win-line{display:block;width:100%;max-width:100%;text-align:center;text-wrap:balance}
#panel .win-line+.win-line{margin-top:18px}#sub{text-align:center;width:100%;max-width:none}#sub .win-line{display:block;width:100%;text-align:center;text-wrap:balance}#sub .win-line+.win-line{margin-top:10px}#panel button{border:0;border-radius:999px;background:#ff9e37;color:#fff;font-size:18px;font-weight:900;padding:13px 32px;box-shadow:0 5px 0 #d97922;cursor:pointer}#panel button:active{transform:translateY(3px);box-shadow:0 2px 0 #d97922}#sub{font-size:12px!important;color:#58758a;margin:16px 0 0!important}#panel.hidden,#overlay.hidden{display:none}#overlay.fight-mode{background:transparent;align-items:flex-end;justify-content:center;padding:0 0 34px;pointer-events:none}#overlay.fight-mode #panel{width:auto;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;color:inherit;pointer-events:none}#overlay.fight-mode #panel h1,#overlay.fight-mode #panel p,#overlay.fight-mode #panel #sub{display:none}#overlay.fight-mode #panel button{pointer-events:auto;min-width:150px;font-size:20px;padding:14px 34px}@media(max-width:540px){#panel p{font-size:15px;max-width:30ch}#panel .win-line{padding-inline:2px}#hint{top:62px;left:18px;right:auto;font-size:12px}#hearts{top:101px;left:18px;font-size:20px}#timer{top:101px;right:18px;font-size:13px}#level{top:14px}#panel{padding:23px 19px}}
</style></head><body><div id="wrap"><canvas id="game" aria-label="Pinguin game. Tap or press Space to jump."></canvas><div id="hud"><div id="level">ICE CAVERN • LEVEL 1 / 3</div><div id="hearts" aria-label="5 hearts remaining">♥ ♥ ♥ ♥ ♥</div><div id="timer" aria-label="Elapsed time">TIME 00:00.0</div><div id="hint">TAP / CLICK / SPACE TO JUMP</div></div><div id="overlay"><div id="panel"><h1>PINGUIN<br><small style="font-size:.52em;letter-spacing:.12em">ZOMBIES</small></h1><p>Enter the Ice Cavern and hop over the zombie penguins!</p><button id="start">ENTER CAVERN</button><p id="sub">Jump when your feet are on the icy ground. Survive all 3 levels!</p></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),levelLabel=document.getElementById('level'),heartsLabel=document.getElementById('hearts'),timerLabel=document.getElementById('timer'),startBtn=document.getElementById('start');
let W=900,H=600,dpr=1,state='title',level=0,last=0,worldX=0,player,obstacles=[],particles=[],speed=245,groundY=0,levelDistance=0,levelPassed=0,deadTimer=0,winTimer=0,hunterX=0,snowballX=0,snowballY=0,hearts=5,runTime=0,bestTime=loadBestTime(),newBest=false,bossHit=false,bossShake=0,bossHits=0,bossHitTimer=0,bossWalkTime=0,bossOrigin=0,shots=[],tt=0,burstT=0,burstMax=.7,burstX=0,burstY=0;
const BURST_WORD='SHMACK!!!',BURST_RISE=255;
const configs=[{speed:245,blocks:[[470,46,58],[690,48,64],[930,48,60],[1150,50,68],[1390,48,62],[1620,50,70]]},{speed:270,blocks:[[440,48,78],[660,50,86],[900,50,80],[1110,52,92],[1350,52,86],[1580,54,96]]},{speed:280,blocks:[[430,52,92],[665,52,98],[905,54,104],[1135,54,100],[1370,56,108],[1610,56,104]]}];
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(420,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);groundY=H*.79;if(player){player.y=Math.min(player.y,groundY-player.h);if(player.grounded)player.y=groundY-player.h}if(obstacles.length)for(const o of obstacles)o.y=groundY-o.h}
window.addEventListener('resize',resize);resize();
function loadBestTime(){try{const n=Number(localStorage.getItem('pinguinBestTime'));return Number.isFinite(n)&&n>0?n:null}catch(e){return null}}
function formatTime(seconds){const minutes=Math.floor(seconds/60),secs=Math.floor(seconds%60),tenths=Math.floor((seconds-Math.floor(seconds))*10);return `${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${tenths}`}
function updateTimer(){timerLabel.textContent=`TIME ${formatTime(runTime)}`;timerLabel.setAttribute('aria-label',`Elapsed time ${formatTime(runTime)}`)}
function startNewRun(){runTime=0;newBest=false;updateTimer()}
function updateHearts(){heartsLabel.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<hearts?'full':'empty'}">♥</span>`).join(' ');heartsLabel.setAttribute('aria-label',`${hearts} hearts remaining`);}
function resetLevel(n,refill=true){level=n;if(refill)hearts=5;speed=configs[n].speed;worldX=0;levelPassed=0;obstacles=configs[n].blocks.map(([x,w,h])=>({x,y:groundY-h,w,h,hit:false}));player={x:W*.19,y:groundY-62,w:48,h:62,vy:0,grounded:true,anim:0};particles=[];shots=[];levelLabel.textContent=`ICE CAVERN • LEVEL ${level+1} / 3`;updateHearts();}
function showScreen(title,desc,button,sub=''){const fightMode=false;overlay.classList.toggle('fight-mode',fightMode);panel.innerHTML=`<h1>${title}</h1><p>${desc}</p><button id="action">${button}</button>${sub?`<p id="sub">${sub}</p>`:''}`;overlay.classList.remove('hidden');document.getElementById('action').addEventListener('click',()=>{if(state==='title'||state==='dead'||state==='win'){const fullRestart=state==='win'||state==='title'||hearts<=0;if(fullRestart){resetLevel(0,true);startNewRun()}else resetLevel(level,false);state='playing';overlay.classList.add('hidden');overlay.classList.remove('fight-mode');last=performance.now();}else if(state==='hunter'){overlay.classList.add('hidden');overlay.classList.remove('fight-mode');state='bossfight';last=performance.now();}})}
function start(){resetLevel(0);startNewRun();state='playing';overlay.classList.add('hidden');last=performance.now()}
startBtn.addEventListener('click',start);
function launchIceBlock(){if(state!=='bossfight')return;shots.push({x:player.x+player.w+4,y:player.y+25});last=performance.now()}
function jump(){if(state==='title'){start();return}if(state==='hunter'||state==='bossfight')return;if(state!=='playing'||!player.grounded)return;player.vy=-730;player.grounded=false;for(let i=0;i<5;i++)particles.push({x:player.x+20+Math.random()*15,y:groundY-3,vx:(Math.random()-.5)*90,vy:-Math.random()*90,life:.35});}
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}if(e.code==='Enter'&&!overlay.classList.contains('hidden')){e.preventDefault();(document.getElementById('action')||document.getElementById('start'))?.click()}});canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='bossfight')launchIceBlock();else jump()});
function die(){if(state!=='playing')return;hearts=Math.max(0,hearts-1);updateHearts();state='dead';if(hearts>0){showScreen('OUCH!','You touched a zombie penguin! Level restarting. You have '+hearts+' '+(hearts===1?'heart':'hearts')+' left.','RETRY LEVEL','You lose one heart each time you touch a zombie penguin.');}else{showScreen('GAME OVER','You ran out of hearts! Let’s start the adventure again.','START AGAIN','You’ll get 5 new hearts at the beginning of Level 1.');}}
function win(){state='win';newBest=bestTime===null||runTime<bestTime;if(newBest){bestTime=runTime;try{localStorage.setItem('pinguinBestTime',String(bestTime))}catch(e){}}const result=newBest?'NEW BEST TIME!':`Your time: ${formatTime(runTime)} · Best: ${formatTime(bestTime)}`;showScreen('YOU WIN!','<span class="win-line">You defeated the King Penguin Zombie!</span><span class="win-line">The Ice Cavern is safe!</span>','PLAY AGAIN',`<span class=\"win-line\">${result}</span><span class=\"win-line\">Can you beat your time next round?</span>`);}
function update(dt){burstT=Math.max(0,burstT-dt);if(['playing','hunter','bossfight','snowball','victory_anim'].includes(state)){runTime+=dt;updateTimer()}if(bossHitTimer>0)bossHitTimer=Math.max(0,bossHitTimer-dt);if(bossShake>0)bossShake=Math.max(0,bossShake-dt*45);if(['bossfight','snowball'].includes(state)){bossWalkTime+=dt;hunterX=bossOrigin-Math.abs(Math.sin(bossWalkTime*1.2))*W*.13;}if(state==='hunter'){return}if(state==='bossfight'){for(const sh of shots){sh.x+=560*dt;sh.y+=(groundY-80-sh.y)*Math.min(1,dt*3);if(!sh.hit&&sh.x>=hunterX-38){sh.hit=true;bossHits++;bossShake=12;bossHitTimer=.48;burstX=hunterX-75;burstY=Math.max(125,groundY-BURST_RISE);burstMax=bossHits>=3?1.15:.7;burstT=burstMax;if(bossHits>=3){state='victory_anim';winTimer=1.15;shots=[];break}}}shots=shots.filter(sh=>!sh.hit&&sh.x<W+40);return}if(state==='victory_anim'){winTimer-=dt;if(winTimer<=0)win();return}if(state!=='playing')return;player.anim+=dt;worldX+=speed*dt;levelPassed+=speed*dt;player.vy+=1750*dt;player.y+=player.vy*dt;if(player.y+player.h>=groundY){player.y=groundY-player.h;player.vy=0;player.grounded=true;}else player.grounded=false;
// Move each obstacle relative to the scrolling world. Obstacles are lethal, not platforms.
for(const o of obstacles){const sx=o.x-worldX+W*.19;if(sx+o.w<0||sx>W+10)continue;const px=player.x+9,pr=player.x+player.w-8,py=player.y+7,pb=player.y+player.h-2;if(pr>sx+3&&px<sx+o.w-3&&pb>o.y+2&&py<groundY-1){die();return}}
particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt}
const lastBlock=obstacles[obstacles.length-1],endX=lastBlock.x+lastBlock.w+280;if(worldX>endX){if(level<2){resetLevel(level+1,true)}else{state='hunter';hunterX=W*.79;bossOrigin=hunterX;bossWalkTime=0;bossHitTimer=0;bossHits=0;showScreen('KING PENGUIN ZOMBIE!','The Zombie King is blocking the cavern! Defeat him with ice blocks.','FIGHT!','Tap anywhere on the screen to throw an ice block. Three hits to win!');last=performance.now();}}
}
// Big comic-book impact burst shown for a moment after each hit.
function drawBurst(){if(burstT<=0)return;const k=burstT/burstMax,age=burstMax-burstT,pop=1+Math.max(0,.18-age)*3,s=Math.min(1,W/520)*pop;const bs=Math.min(1,W/520);ctx.save();ctx.translate(Math.max(125*bs,Math.min(W-125*bs,burstX)),burstY);ctx.rotate(-.12);ctx.scale(s,s);ctx.globalAlpha=Math.min(1,k*4);
ctx.beginPath();for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=i%2?62:98;ctx.lineTo(Math.cos(a)*r*1.35,Math.sin(a)*r*.85)}ctx.closePath();ctx.fillStyle='#ffe23b';ctx.fill();ctx.strokeStyle='#d0261c';ctx.lineWidth=7;ctx.stroke();
ctx.font=(BURST_WORD.length>8?'900 36px':'900 42px')+' Impact, "Arial Black", system-ui';ctx.textAlign='center';ctx.textBaseline='middle';const fit=Math.min(1,150/ctx.measureText(BURST_WORD).width);ctx.scale(fit,fit);ctx.lineWidth=9;ctx.strokeStyle='#1b1020';ctx.strokeText(BURST_WORD,0,2);ctx.fillStyle='#ff3b2f';ctx.fillText(BURST_WORD,0,2);ctx.restore();ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071421');g.addColorStop(1,'#17384a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// Ice cavern ceiling and walls
ctx.fillStyle='#183f52';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,groundY*.48);ctx.quadraticCurveTo(W*.82,groundY*.35,W*.67,groundY*.49);ctx.quadraticCurveTo(W*.5,groundY*.27,W*.33,groundY*.48);ctx.quadraticCurveTo(W*.14,groundY*.34,0,groundY*.5);ctx.closePath();ctx.fill();
ctx.fillStyle='#24576c';ctx.beginPath();ctx.moveTo(0,0);for(let x=0;x<=W;x+=55){ctx.lineTo(x,75+Math.sin((x+worldX*.1)/70)*30)}ctx.lineTo(W,0);ctx.closePath();ctx.fill();
// hanging icicles
for(let i=0;i<12;i++){let x=((i*117-worldX*.18)%(W+140)+W+140)%(W+140)-70;let h=25+(i%4)*17;ctx.fillStyle='#9edff0';ctx.beginPath();ctx.moveTo(x,68);ctx.lineTo(x+11,68+h);ctx.lineTo(x+22,68);ctx.closePath();ctx.fill();}
// cavern crystals
for(let i=0;i<9;i++){let x=((i*173-worldX*.25)%(W+180)+W+180)%(W+180)-90;let y=groundY-55-(i%3)*25;ctx.fillStyle='#65bfd7';ctx.beginPath();ctx.moveTo(x,y+45);ctx.lineTo(x+12,y);ctx.lineTo(x+25,y+45);ctx.closePath();ctx.fill();}
// icy ground
ctx.fillStyle='#dff8ff';ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='#b9e9f4';ctx.fillRect(0,groundY+9,W,6);ctx.strokeStyle='#8ecddd';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<W;x+=50){let xx=(x-worldX*.6%50+50)%W;ctx.moveTo(xx,groundY+25);ctx.lineTo(xx+17,groundY+25)}ctx.stroke();}
function drawPenguin(){const p=player,x=p.x,y=p.y,w=p.w,h=p.h;ctx.save();ctx.translate(x+w/2,y+h/2);if(!p.grounded)ctx.rotate(-.08); // shadow
ctx.fillStyle='#6db8d0a0';ctx.beginPath();ctx.ellipse(0,h/2+7,25,5,0,0,Math.PI*2);ctx.fill();
// body
ctx.fillStyle='#173b55';ctx.beginPath();ctx.ellipse(0,2,23,31,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7fdff';ctx.beginPath();ctx.ellipse(1,8,15,22,0,0,Math.PI*2);ctx.fill();
// wings
ctx.fillStyle='#234e69';ctx.beginPath();ctx.ellipse(-20,8,6,17,.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(20,8,6,17,-.2,0,Math.PI*2);ctx.fill();
// feet
ctx.fillStyle='#ff982e';ctx.beginPath();ctx.ellipse(-11,29,10,5,.12,0,Math.PI*2);ctx.ellipse(10,29,10,5,-.12,0,Math.PI*2);ctx.fill();
// face
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-13,6,0,Math.PI*2);ctx.arc(8,-13,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#142f43';ctx.beginPath();ctx.arc(-6,-12,2.5,0,Math.PI*2);ctx.arc(9,-12,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9a2e';ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(10,-2);ctx.lineTo(-2,3);ctx.closePath();ctx.fill();ctx.restore();}
// Light red veins: thin branching lines.
function veins(list,w){ctx.save();ctx.strokeStyle='#ff8a7a';ctx.globalAlpha=.75;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();for(const v of list){ctx.moveTo(v[0],v[1]);for(let i=2;i<v.length;i+=2)ctx.lineTo(v[i],v[i+1])}ctx.stroke();ctx.restore()}
function stitches(x1,y1,x2,y2,n,len){ctx.strokeStyle='#0d2414';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),nx=-dy/d*len,ny=dx/d*len;for(let i=0;i<=n;i++){const t=i/n,x=x1+dx*t,y=y1+dy*t;ctx.moveTo(x-nx,y-ny);ctx.lineTo(x+nx,y+ny)}ctx.stroke()}
function glowEye(x,y,rx,ry,tilt,blur){ctx.fillStyle='#0a1a0f';ctx.beginPath();ctx.ellipse(x,y,rx+3,ry+3,tilt,0,Math.PI*2);ctx.fill();ctx.save();ctx.shadowColor='#ff1f1f';ctx.shadowBlur=blur;ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.ellipse(x,y,rx,ry,tilt,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#ffd0c4';ctx.beginPath();ctx.arc(x-rx*.3,y-ry*.35,Math.max(1,rx*.18),0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a0006';ctx.beginPath();ctx.arc(x+rx*.1,y+ry*.05,Math.max(1.2,rx*.28),0,Math.PI*2);ctx.fill()}
// Regular zombie penguin: dark green, lime belly and patches, glowing red eyes, light red veins. No crown or cape.
// Drawn from its feet and scaled to its obstacle height, so it always stands on the ice and fills its hitbox.
function drawZombie(o){const x=o.x-worldX+W*.19;if(x+o.w<-30||x>W+30)return;const s=o.h/70,sway=Math.sin(tt*3.2+o.x*.01)*.06;ctx.save();ctx.translate(x+o.w/2,groundY);ctx.scale(s,s);
ctx.fillStyle='#02081499';ctx.beginPath();ctx.ellipse(0,0,26,5,0,0,Math.PI*2);ctx.fill();
// dull, ragged feet
ctx.fillStyle='#a8692b';ctx.beginPath();ctx.ellipse(-11,-3,10,4.5,.12,0,Math.PI*2);ctx.ellipse(10,-3,10,4.5,-.12,0,Math.PI*2);ctx.fill();
ctx.rotate(sway);
// arms reaching out toward Pinguin
ctx.fillStyle='#163d24';ctx.beginPath();ctx.ellipse(-20,-38,6,16,1.15+sway*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0f2e1a';ctx.beginPath();ctx.ellipse(16,-34,6,15,.75-sway*2,0,Math.PI*2);ctx.fill();
// hunched body
let g=ctx.createLinearGradient(-24,-70,24,0);g.addColorStop(0,'#3d7a43');g.addColorStop(.55,'#21502c');g.addColorStop(1,'#10301b');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-33,23,32,-.05,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0a2012';ctx.lineWidth=2;ctx.stroke();
// lime belly with a darker torn patch and stitches
ctx.fillStyle='#a6e04c';ctx.beginPath();ctx.ellipse(2,-25,14,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#74b23a';ctx.beginPath();ctx.moveTo(-6,-30);ctx.lineTo(4,-34);ctx.lineTo(10,-25);ctx.lineTo(3,-17);ctx.lineTo(-7,-20);ctx.closePath();ctx.fill();stitches(-9,-14,9,-11,4,2.5);
// lime patch on the head
ctx.fillStyle='#8fcf45';ctx.beginPath();ctx.ellipse(-12,-55,6,4,-.4,0,Math.PI*2);ctx.fill();
// scraggly hair tufts
ctx.strokeStyle='#0f2a18';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-64);ctx.lineTo(-8,-73);ctx.moveTo(1,-65);ctx.lineTo(2,-75);ctx.moveTo(6,-64);ctx.lineTo(11,-71);ctx.stroke();
// heavy brow, sunken mismatched glowing eyes
ctx.fillStyle='#0d2a17';ctx.beginPath();ctx.moveTo(-16,-55);ctx.lineTo(-1,-49);ctx.lineTo(16,-56);ctx.lineTo(16,-52);ctx.lineTo(-1,-46);ctx.lineTo(-16,-51);ctx.closePath();ctx.fill();
glowEye(-7,-45,5.5,4.2,.15,10);glowEye(8,-46,4.6,3.6,-.2,9);
// cracked beak and crooked teeth
ctx.fillStyle='#c97a2a';ctx.beginPath();ctx.moveTo(-3,-38);ctx.lineTo(11,-35);ctx.lineTo(-2,-31);ctx.closePath();ctx.fill();ctx.strokeStyle='#5a3110';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(3,-37);ctx.lineTo(5,-34);ctx.stroke();
ctx.strokeStyle='#0a1a0f';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-25);ctx.lineTo(-4,-28);ctx.lineTo(1,-26);ctx.lineTo(6,-28);ctx.lineTo(10,-24);ctx.stroke();stitches(-8,-26,9,-26,4,2.4);
veins([[-19,-50,-14,-47,-15,-42],[18,-50,13,-48,14,-43],[-21,-22,-16,-19,-18,-13],[20,-25,15,-21,17,-16],[-5,-62,-2,-58,-4,-55]],1.1);
ctx.restore()}
